<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Socrates-Web</title>
<style>
  :root {
    --bg: #fffff8;
    --ink: #111;
    --muted: #6b6b6b;
    --rule: #e3e3dd;
    --accent: #b3261e;
    --faded: #9aa0a6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Palatino Linotype", "Book Antiqua", Palatino, serif;
    line-height: 1.55;
    display: flex;
    flex-direction: column;
  }
  header { padding: 1.1rem 2rem 0; }
  header h1 { font-size: 1.3rem; font-weight: normal; margin: 0; }
  header .sub { color: var(--muted); font-style: italic; margin: 0.1rem 0 0; }

  #layout {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 60% 40%;
    border-top: 1px solid var(--rule);
    margin-top: 0.8rem;
  }

  /* left — chat */
  #chat { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--rule); }
  #stream { flex: 1; overflow-y: auto; padding: 1.5rem 2rem; }
  #composer { border-top: 1px solid var(--rule); padding: 0.7rem 1rem; display: flex; gap: 0.5rem; }
  #composer input { flex: 1; font-family: inherit; font-size: 1rem; background: transparent; border: none; outline: none; color: var(--ink); }
  #composer button { font-family: inherit; background: transparent; border: 1px solid var(--rule); color: var(--ink); padding: 0.25rem 0.9rem; cursor: pointer; }
  #composer button:disabled { color: var(--faded); cursor: default; }

  /* right — dashboard */
  #dash { overflow-y: auto; padding: 1.5rem 2rem 3rem; }
  h2 { font-size: 0.95rem; font-weight: normal; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin: 2rem 0 0.4rem; }
  h2:first-of-type { margin-top: 0; }
  hr { border: none; border-top: 1px solid var(--rule); margin: 1.4rem 0; }

  .destination { font-size: 1.35rem; line-height: 1.4; }
  .artifact { color: var(--muted); font-style: italic; margin-top: 0.3rem; }

  .concept { display: flex; align-items: baseline; gap: 0.5rem; padding: 0.12rem 0; cursor: pointer; }
  .concept:hover .name { text-decoration: underline; }
  .name { }
  .label { color: var(--muted); font-size: 0.9em; }
  .due { color: var(--accent); font-weight: bold; }
  .upcoming, .unscheduled { color: var(--muted); }
  .mis-open { color: var(--accent); }
  .mis-resolved { color: var(--faded); }
  .meta { color: var(--muted); font-size: 0.9em; }

  .msg { margin: 0 0 1rem; white-space: pre-wrap; }
  .msg.user { }
  .msg.assistant { }
  .msg.thinking { color: var(--muted); font-style: italic; }
  .msg.meta { color: var(--muted); }
</style>
</head>
<body>
  <header>
    <h1>Socrates-Web</h1>
    <p class="sub">active recall &middot; Socratic grilling &middot; spaced repetition</p>
  </header>

  <div id="layout">
    <section id="chat">
      <div id="stream"></div>
      <div id="composer">
        <input id="input" placeholder="Ask, or explain a concept…" autocomplete="off">
        <button id="send">Send</button>
      </div>
    </section>

    <aside id="dash">
      <div id="mission"></div>
      <h2>Active Syllabus</h2>
      <div id="concepts"></div>
      <h2>Spaced Repetition Timeline</h2>
      <div id="timeline"></div>
      <h2>Misconception Board</h2>
      <div id="misconceptions"></div>
    </aside>
  </div>

  <script src="/app.js"></script>
</body>
</html>
